# kind cluster for local Kubernetes (Phase 0). Requires kind binary (not needed for docker-compose-only loop).
# Create: kind create cluster --config infrastructure/kind/config.yaml
# Delete: kind delete cluster --name skybridge
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: skybridge
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
  - role: worker
  - role: worker
networking:
  disableDefaultCNI: false

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="SKYBRIDGE architecture overview">
  <title>SKYBRIDGE architecture overview (local demo)</title>
  <defs>
    <marker id="ctl" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4f9cf9"/>
    </marker>
    <marker id="dat" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2fbf71"/>
    </marker>
    <marker id="aut" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d9a021"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="620" rx="12" fill="#0f141b"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#e6edf5">SKYBRIDGE — local migration control plane</text>
  <text x="30" y="60" font-size="13" fill="#93a1b5">AWS → Azure stateful migration on one machine · real cloud NOT USED · spend $0</text>

  <!-- Console -->
  <g>
    <rect x="30" y="90" width="200" height="110" rx="8" fill="#1a2230" stroke="#4f9cf9" stroke-width="1.5"/>
    <text x="44" y="116" font-size="14" font-weight="700" fill="#e6edf5">Console</text>
    <text x="44" y="136" font-size="12" fill="#93a1b5">Next.js · read-only</text>
    <text x="44" y="154" font-size="12" fill="#93a1b5">dashboard · CDC · cutover</text>
    <text x="44" y="172" font-size="12" fill="#93a1b5">ownership · safety · AI review</text>
  </g>

  <!-- AI Advisor -->
  <g>
    <rect x="30" y="230" width="200" height="110" rx="8" fill="#1a2230" stroke="#8b7ad9" stroke-width="1.5"/>
    <text x="44" y="256" font-size="14" font-weight="700" fill="#e6edf5">AI Advisor</text>
    <text x="44" y="276" font-size="12" fill="#93a1b5">advisory only</text>
    <text x="44" y="294" font-size="12" fill="#93a1b5">authorization: NEVER_BY_AI</text>
    <text x="44" y="312" font-size="12" fill="#93a1b5">evidence-grounded review</text>
  </g>

  <!-- Control Plane -->
  <g>
    <rect x="290" y="90" width="400" height="380" rx="8" fill="#161d27" stroke="#e6edf5" stroke-width="1.5"/>
    <text x="306" y="116" font-size="14" font-weight="700" fill="#e6edf5">Control Plane (Go :18080)</text>
    <text x="306" y="136" font-size="12" fill="#93a1b5">register · rehearse · canary · quiesce · cutover · audit</text>
    <g font-size="12" fill="#e6edf5">
      <rect x="306" y="150" width="184" height="52" rx="6" fill="#1a2230" stroke="#2a3547"/>
      <text x="318" y="172">Policy</text><text x="318" y="190" font-size="11" fill="#93a1b5">Rego + Go mirror</text>
      <rect x="498" y="150" width="176" height="52" rx="6" fill="#1a2230" stroke="#2a3547"/>
      <text x="510" y="172">Approval</text><text x="510" y="190" font-size="11" fill="#93a1b5">human, evidence-bound</text>
      <rect x="306" y="212" width="184" height="52" rx="6" fill="#1a2230" stroke="#2a3547"/>
      <text x="318" y="234">Temporal</text><text x="318" y="252" font-size="11" fill="#93a1b5">mock activities only</text>
      <rect x="498" y="212" width="176" height="52" rx="6" fill="#1a2230" stroke="#2a3547"/>
      <text x="510" y="234">Cloud Adapters</text><text x="510" y="252" font-size="11" fill="#93a1b5">LOCAL_FIXTURE</text>
      <rect x="306" y="274" width="368" height="56" rx="6" fill="#241d1d" stroke="#e5534b"/>
      <text x="318" y="296">Terraform boundary — Apply DISABLED</text>
      <text x="318" y="314" font-size="11" fill="#93a1b5">14 modules · fmt/validate only · ApplyEnabled=false</text>
    </g>
    <text x="306" y="360" font-size="12" font-weight="700" fill="#e6edf5">Compatibility · Drift · Ownership (CAS) · Idempotency</text>
    <text x="306" y="380" font-size="12" fill="#93a1b5">quiesce · reconciliation (probe-scoped) · recovery/resume</text>
    <text x="306" y="410" font-size="12" fill="#93a1b5">compat → plan → drift → policy → approval → execution</text>
    <text x="306" y="432" font-size="12" fill="#93a1b5">fail-closed on every refusal · audit trail on every transition</text>
  </g>

  <!-- CDC pipeline -->
  <g>
    <rect x="290" y="500" width="400" height="80" rx="8" fill="#12241a" stroke="#2fbf71" stroke-width="1.5"/>
    <text x="306" y="524" font-size="13" font-weight="700" fill="#e6edf5">CDC pipeline (data replication flow)</text>
    <text x="306" y="548" font-size="12" fill="#93a1b5">Debezium (WAL) → Redpanda (topics) → CDC Applier (dedupe + checkpoint)</text>
    <text x="306" y="566" font-size="12" fill="#93a1b5">measured lag · RPO gate · probe-scoped reconciliation</text>
  </g>

  <!-- AWS -->
  <g>
    <rect x="740" y="90" width="210" height="200" rx="8" fill="#1a2230" stroke="#ff9900" stroke-width="1.5"/>
    <text x="754" y="116" font-size="14" font-weight="700" fill="#e6edf5">AWS (source)</text>
    <text x="754" y="136" font-size="12" fill="#93a1b5">CloudShop app :8085</text>
    <text x="754" y="154" font-size="12" fill="#93a1b5">PostgreSQL :5433 (WAL)</text>
    <text x="754" y="172" font-size="12" fill="#93a1b5">Redis · storage · queue</text>
    <text x="754" y="196" font-size="12" font-weight="700" fill="#2fbf71">starts AUTHORITATIVE</text>
    <text x="754" y="214" font-size="12" fill="#93a1b5">ends REJECTING (403)</text>
    <text x="754" y="236" font-size="12" fill="#93a1b5">local fixture · no real AWS</text>
  </g>

  <!-- Azure -->
  <g>
    <rect x="740" y="320" width="210" height="200" rx="8" fill="#1a2230" stroke="#0078d4" stroke-width="1.5"/>
    <text x="754" y="346" font-size="14" font-weight="700" fill="#e6edf5">Azure (target)</text>
    <text x="754" y="366" font-size="12" fill="#93a1b5">CloudShop app :8086</text>
    <text x="754" y="384" font-size="12" fill="#93a1b5">PostgreSQL :5434</text>
    <text x="754" y="402" font-size="12" fill="#93a1b5">Redis · storage · queue</text>
    <text x="754" y="426" font-size="12" fill="#93a1b5">starts STANDBY</text>
    <text x="754" y="444" font-size="12" font-weight="700" fill="#2fbf71">ends AUTHORITATIVE</text>
    <text x="754" y="466" font-size="12" fill="#93a1b5">local fixture · no real Azure</text>
  </g>

  <!-- Flows: control (blue) -->
  <line x1="230" y1="140" x2="286" y2="140" stroke="#4f9cf9" stroke-width="2" marker-end="url(#ctl)"/>
  <text x="232" y="130" font-size="11" fill="#4f9cf9">GET (read-only)</text>
  <line x1="230" y1="285" x2="286" y2="300" stroke="#4f9cf9" stroke-width="2" marker-end="url(#ctl)"/>
  <text x="232" y="278" font-size="11" fill="#4f9cf9">GET evidence</text>

  <!-- Flows: data replication (green) -->
  <line x1="795" y1="290" x2="640" y2="500" stroke="#2fbf71" stroke-width="2" marker-end="url(#dat)"/>
  <text x="660" y1="420" font-size="11" fill="#2fbf71">WAL → Debezium</text>
  <line x1="640" y1="540" x2="738" y2="430" stroke="#2fbf71" stroke-width="2" marker-end="url(#dat)"/>
  <text x="648" y1="500" font-size="11" fill="#2fbf71">apply → target PG</text>

  <!-- Flows: authority/cutover (amber, dashed) -->
  <line x1="690" y1="380" x2="738" y2="250" stroke="#d9a021" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#aut)"/>
  <text x="694" y1="320" font-size="11" fill="#d9a021">flips source first</text>
  <line x1="690" y1="400" x2="738" y2="420" stroke="#d9a021" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#aut)"/>
  <text x="694" y1="412" font-size="11" fill="#d9a021">then target</text>

  <!-- Legend -->
  <g font-size="12" fill="#93a1b5">
    <line x1="30" y1="596" x2="70" y2="596" stroke="#4f9cf9" stroke-width="2" marker-end="url(#ctl)"/>
    <text x="78" y="600">control flow (GET / probes)</text>
    <line x1="300" y1="596" x2="340" y2="596" stroke="#2fbf71" stroke-width="2" marker-end="url(#dat)"/>
    <text x="348" y="600">data replication flow</text>
    <line x1="580" y1="596" x2="620" y2="596" stroke="#d9a021" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#aut)"/>
    <text x="628" y="600">authority / cutover flow</text>
  </g>
</svg>
